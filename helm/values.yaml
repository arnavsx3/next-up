backend:
  replicaCount: 1

  image:
    repository: next-up-backend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    port: 8000
    targetPort: 8000

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 35

frontend:
  replicaCount: 1

  image:
    repository: next-up-frontend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    port: 80
    targetPort: 80

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 35

config:
  environment: production

secret:
  databaseUrl: ""

ingress:
  enabled: true
  className: nginx
