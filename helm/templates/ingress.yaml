apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: next-up-ingress
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: next-up-backend-service
                port:
                  number: {{ .Values.backend.service.port }}

          - path: /
            pathType: Prefix
            backend:
              service:
                name: next-up-frontend-service
                port:
                  number: {{ .Values.frontend.service.port }}